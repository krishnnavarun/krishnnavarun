<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230">
  <style>
    @keyframes boxSlideDown {
      0% { opacity: 0; transform: translateY(-12px) scale(0.4); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1.5px; }
    .header-bar { fill: #161b22; rx: 10px; ry: 10px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title { font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px; fill: #39d353; font-weight: 600; }
    .title-cmd { fill: #c9d1d9; }
    .title-host { fill: #58a6ff; }

    .label {
      font-family: 'Fira Code', 'Consolas', 'Segoe UI', sans-serif;
      font-size: 10px;
      fill: #8b949e;
    }
    .stats-footer {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #c9d1d9;
    }
  </style>

  <!-- Background -->
  <rect width="860" height="230" class="bg" />

  <!-- Terminal Header -->
  <path d="M 0 0 h 860 v 36 h -860 Z" class="header-bar" />
  <circle cx="20" cy="18" r="5" class="dot-red" />
  <circle cx="36" cy="18" r="5" class="dot-yellow" />
  <circle cx="52" cy="18" r="5" class="dot-green" />
  <text x="72" y="22" class="title">
    <tspan class="title-host">krishnnavarun@github</tspan> ~ $ <tspan class="title-cmd">./contributions.sh</tspan>
  </text>

  <!-- Month Labels -->
  <text x="50" y="60" class="label">Oct</text>
  <text x="115" y="60" class="label">Nov</text>
  <text x="190" y="60" class="label">Dec</text>
  <text x="255" y="60" class="label">Jan</text>
  <text x="330" y="60" class="label">Feb</text>
  <text x="395" y="60" class="label">Mar</text>
  <text x="470" y="60" class="label">Apr</text>
  <text x="540" y="60" class="label">May</text>
  <text x="610" y="60" class="label">Jun</text>
  <text x="680" y="60" class="label">Jul</text>
  <text x="750" y="60" class="label">Aug</text>
  <text x="815" y="60" class="label">Sep</text>

  <!-- Day Labels -->
  <text x="33" y="94" text-anchor="end" class="label">Mon</text>
  <text x="33" y="124" text-anchor="end" class="label">Wed</text>
  <text x="33" y="154" text-anchor="end" class="label">Fri</text>

  <!-- Contribution Box Grid -->
  <g>
    <!-- We generate grid boxes dynamically via Python or SVG rect pattern -->
    <g transform="translate(45, 70)">
      <!-- Standard 53 columns -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="11.5" height="11.5" rx="2.5" fill="#0e4429" style="animation: boxSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.01s both;" />
        <rect x="0" y="15" width="11.5" height="11.5" rx="2.5" fill="#006d32" style="animation: boxSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.04s both;" />
        <rect x="0" y="30" width="11.5" height="11.5" rx="2.5" fill="#26a641" style="animation: boxSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.07s both;" />
        <rect x="0" y="45" width="11.5" height="11.5" rx="2.5" fill="#39d353" style="animation: boxSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.10s both;" />
        <rect x="0" y="60" width="11.5" height="11.5" rx="2.5" fill="#0e4429" style="animation: boxSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.13s both;" />
        <rect x="0" y="75" width="11.5" height="11.5" rx="2.5" fill="#161b22" style="animation: boxSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.16s both;" />
        <rect x="0" y="90" width="11.5" height="11.5" rx="2.5" fill="#0e4429" style="animation: boxSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.19s both;" />
      </g>
    </g>
  </g>

  <!-- Legend & Stats Footer -->
  <g>
    <text x="45" y="208" class="stats-footer">1,248 contributions in the last year • 14 day streak (best: 42 days)</text>
    <text x="678" y="208" class="label">Less</text>
    <rect x="710" y="199" width="10" height="10" rx="2" fill="#161b22" />
    <rect x="724" y="199" width="10" height="10" rx="2" fill="#0e4429" />
    <rect x="738" y="199" width="10" height="10" rx="2" fill="#006d32" />
    <rect x="752" y="199" width="10" height="10" rx="2" fill="#26a641" />
    <rect x="766" y="199" width="10" height="10" rx="2" fill="#39d353" />
    <rect x="780" y="199" width="10" height="10" rx="2" fill="#69f0a0" />
    <text x="796" y="208" class="label">More</text>
  </g>
</svg>
